<html>
  <head>
<style>
  iframe {
  /* Makes the iframe fill the width of its container */
  width: 100%;
  
  /* Removes the default border around the iframe */
  border: none;
  
  /* Optional: Adds a slight border radius to the iframe for a modern look */
  border-radius: 8px; 
  
  /* Optional: Adds a subtle shadow to make it stand out like a card */
  box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1); 
}

/* Optional: To hide the scrollbar of the embedded content if needed */
iframe::-webkit-scrollbar { 
  display: none;
}
</style>
    
  </head>
  <body>
    <iframe src="https://docs.google.com/spreadsheets/d/e/2PACX-1vS44EzW1bu90ADxm4Hmc6pmWWVF-SWhnLVesCiaPatzWeQttPsMToRQlzfMw9CV-SLxDTlxq2cF-31J/pubhtml?gid=1503358489&amp;single=true&amp;widget=true&amp;headers=false"
      width="100%" 
      height="600"
      frameborder="0"></iframe>
  </body>
</html>
